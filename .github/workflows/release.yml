name: Release npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release tag
        run: node -e "const version=require('./package.json').version;if(process.env.GITHUB_REF_NAME !== 'v'+version)throw new Error('Release tag must match package version')"
      - run: npm run test:public
      - run: npm run test:release
      - run: npm publish
